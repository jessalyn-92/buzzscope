name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + agent-loop tests (no API key needed)
        run: pytest -q
      - name: Offline baseline eval
        run: buzzscope eval --mode baseline
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
