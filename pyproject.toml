[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buzzscope"
version = "0.1.0"
description = "BuzzScope 輿情雷達：會自己規劃、爬取、分析並解釋聲量異常的網路輿情分析 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "pydantic>=2.5",
    "plotly>=5.18",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
buzzscope = "buzzscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
